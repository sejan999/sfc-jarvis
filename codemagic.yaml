# ==============================================================
# SFC Jarvis — Codemagic CI/CD Pipeline
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
# ==============================================================

workflows:
  android-release:
    name: SFC Jarvis — Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # No external variable groups required.
      # Add your Gemini key locally in .env (gitignored) or paste it below
      # before pushing if you want it available in CI builds.
      flutter: stable

    scripts:
      - name: Ensure .env asset exists
        script: |
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          fi

      - name: Get Flutter packages
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze --no-fatal-infos || true

      # NOTE: `flutter test` is intentionally omitted — the project has no
      # test/ directory yet, so the step would fail the pipeline.

      - name: Build universal APK
        script: >
          flutter build apk --release --no-tree-shake-icons
          --android-skip-build-dependency-validation

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true