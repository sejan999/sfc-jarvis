# ==============================================================
# SFC Jarvis — Codemagic CI/CD Pipeline
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
# ==============================================================

workflows:
  android-release:
    name: SFC Jarvis — Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Secrets configured in Codemagic UI (Environment variables):
      #   GEMINI_API_KEY  — Google Gemini API key
      #   CM_KEYSTORE / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS /
      #   CM_KEY_PASSWORD — release signing credentials
      groups:
        - keystore_credentials
        - env_vars
      vars:
        BUNDLE_ID: com.sfc.jarvis
      flutter: stable

    scripts:
      - name: Bootstrap .env from secrets
        script: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          echo "GEMINI_MODEL=gemini-2.0-flash" >> .env
          echo "SEARCH_API_URL=https://api.duckduckgo.com/" >> .env

      - name: Get Flutter packages
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze --no-fatal-infos || true

      - name: Run tests
        script: flutter test || true

      - name: Set up debug keystore for signing (CI fallback)
        script: |
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "No release keystore configured; using debug signing."
          fi

      - name: Build release APK & App Bundle
        script: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true