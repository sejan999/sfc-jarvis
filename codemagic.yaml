# ==============================================================
# SFC Jarvis — Codemagic CI/CD Pipeline
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
# ==============================================================

workflows:
  android-release:
    name: SFC Jarvis — Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # No external variable groups required.
      # Add your Gemini key locally in .env (gitignored) or paste it below
      # before pushing if you want it available in CI builds.
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze --no-fatal-infos || true

      - name: Run tests
        script: flutter test || true

      - name: Build universal APK
        script: flutter build apk --release --android-skip-build-dependency-validation

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true